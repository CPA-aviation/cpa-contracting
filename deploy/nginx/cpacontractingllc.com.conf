# cpacontractingllc.com — final Nginx config (HTTPS, canonical host = www).
# Location on VPS: /etc/nginx/sites-available/cpacontractingllc.com
# Site:            static export, served from /app/cpa-contracting/out (no Node server / PM2)

# 1) HTTP: serve ACME challenges (certificate renewal), redirect everything else to https://www
server {
    listen 80;
    listen [::]:80;
    server_name cpacontractingllc.com www.cpacontractingllc.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://www.cpacontractingllc.com$request_uri;
    }
}

# 2) HTTPS apex: redirect to www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cpacontractingllc.com;

    ssl_certificate     /etc/letsencrypt/live/cpacontractingllc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpacontractingllc.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://www.cpacontractingllc.com$request_uri;
}

# 3) HTTPS www: the real site, static files
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cpacontractingllc.com;

    ssl_certificate     /etc/letsencrypt/live/cpacontractingllc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpacontractingllc.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/cpacontractingllc.com.access.log;
    error_log  /var/log/nginx/cpacontractingllc.com.error.log;

    root  /app/cpa-contracting/out;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers (formerly sent by next.config.ts). Declared at server level only:
    # an add_header inside a location would drop all of these for that location.
    # connect-src allows the browser to post enquiries to the CPA leads API.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; img-src 'self'; font-src 'self' https://fonts.gstatic.com; media-src 'self' https://d8j0ntlcm91z4.cloudfront.net; connect-src 'self' https://clp.cpaleasing.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'; manifest-src 'self'; upgrade-insecure-requests" always;

    # Hashed build assets never change: cache for a long time.
    location /_next/static/ {
        expires 1y;
        access_log off;
    }

    # /about -> about.html, / -> index.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
