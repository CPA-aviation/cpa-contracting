# cpacontractingllc.com — final Nginx config (HTTPS, canonical host = www).
# Location on VPS: /etc/nginx/sites-available/cpacontractingllc.com
# Next.js app:     127.0.0.1:3001 (managed by PM2, name "cpa-contracting")

upstream cpa_contracting {
    server 127.0.0.1:3001;
    keepalive 16;
}

# 1) HTTP: serve ACME challenges (certificate renewal), redirect everything else to https://www
server {
    listen 80;
    listen [::]:80;
    server_name cpacontractingllc.com www.cpacontractingllc.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://www.cpacontractingllc.com$request_uri;
    }
}

# 2) HTTPS apex: redirect to www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cpacontractingllc.com;

    ssl_certificate     /etc/letsencrypt/live/cpacontractingllc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpacontractingllc.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://www.cpacontractingllc.com$request_uri;
}

# 3) HTTPS www: the real site, proxied to Next.js
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cpacontractingllc.com;

    ssl_certificate     /etc/letsencrypt/live/cpacontractingllc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpacontractingllc.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/cpacontractingllc.com.access.log;
    error_log  /var/log/nginx/cpacontractingllc.com.error.log;

    # Contact form posts are tiny; reject large bodies at the proxy.
    client_max_body_size 1m;

    # Security headers (CSP, HSTS, X-Frame-Options...) are sent by Next.js itself
    # (next.config.ts), so they are not repeated here.

    location / {
        proxy_pass http://cpa_contracting;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Host / Origin headers must be passed through: Next.js Server Actions
        # (the contact form) compare Origin with the forwarded host.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_read_timeout 60s;
    }
}
