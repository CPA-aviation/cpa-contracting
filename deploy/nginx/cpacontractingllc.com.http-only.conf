# STEP 1 (temporary) — only used to obtain the first Let's Encrypt certificate.
# Copy to /etc/nginx/sites-available/cpacontractingllc.com, enable, reload,
# run certbot, then replace this file with cpacontractingllc.com.conf.

server {
    listen 80;
    listen [::]:80;
    server_name cpacontractingllc.com www.cpacontractingllc.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 200 "cpacontractingllc.com - certificate setup in progress\n";
        default_type text/plain;
    }
}
